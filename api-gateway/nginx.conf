upstream user_service {
    server user-service:8080;
}

#upstream product_service {
#    server product-service:8080;
#}
#upstream order_service {
#    server order-service:8080;
#}

server {
    listen 80;

    # 1. Endpoint de validación de token
    # Es una ubicación interna, no se puede acceder desde el exterior.
    # NGINX usa esta sección para saber a dónde enviar las sub-peticiones de autenticación.
    location = /_validate_token {
        internal; # Solo para peticiones internas de NGINX

        # Apunta al endpoint que ya debes tener en tu 'user-service' para validar tokens.
        # Por ejemplo: /api/auth/validate
        proxy_pass http://user_service/api/auth/validate;

        # Cabeceras importantes para la sub-petición
        proxy_pass_request_body off; # No enviar el cuerpo de la petición original
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization; # Reenvía la cabecera de autorización original
    }

    # 2. Endpoints públicos (no requieren token)
    # El login y el registro son los únicos endpoints públicos.
    location /api/auth/ {
        proxy_pass http://user-service:8080/api/auth/;
    }

    # 3. Endpoints protegidos (requieren token)
    # Todas las demás rutas bajo /api/ están protegidas.
    location /api/ {
        # Dispara la sub-petición de validación a la location '/_validate_token'
        auth_request /_validate_token;

        # Si la validación es exitosa (2xx), la petición original continúa.
        # El 'upstream' se determina por la ruta específica que coincida a continuación.

        #location /api/products/ {
        #    proxy_pass http://product_service/api/products/;
        #}

        #location /api/orders/ {
        #    proxy_pass http://order_service/api/orders/;
        #}

        #location /api/profile/ {
        #    proxy_pass http://user_service/api/profile/;
        #}

        # Aquí puedes añadir más rutas protegidas...
        # location /api/admin/ { ... }
    }
}