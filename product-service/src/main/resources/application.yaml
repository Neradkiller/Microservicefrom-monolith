spring:
  application:
    name: product-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: product-service-group
      auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "*"
      security.protocol: PLAINTEXT
  datasource:
    url: jdbc:postgresql://postgres-products:5432/product
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
      show_sql: true
      format_sql: true
      generate_statistics: true

      jdbc:
        batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: "mySuperSecretKeyThatIsVeryLongAndSecure1234567890"
    expiration: 86400000
  error-handling:
    include-stacktrace: NEVER
    include-exception: false
    include-binding-errors: ALWAYS

management:
  endpoints:
    web:
      base-path: '/actuator'
      exposure:
        include: "*"
  health:
    show-details: always
    probes:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
server:
  port: 8081

logging:
  level:
    # Corrige la configuración de Hibernate para ver las sentencias SQL
    org.hibernate.SQL: DEBUG
    # Muestra los parámetros enlazados en las consultas
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.non_real_ecommerce.product_service: DEBUG # Mantiene el nivel de tu paquete principal
    com.non_real_ecommerce.product_service.infrastructure.controller.GlobalExceptionHandler: WARN
